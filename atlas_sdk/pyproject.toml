[project]
name = "atlas-sdk"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# What strategies import: broker orders and the wire protocol. No daemon code, no API keys.
dependencies = [
    "msgspec",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Docs hold pseudocode; don't let `ruff format` rewrite their code blocks.
extend-exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
exclude = ["**/__pycache__", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false
