name: Atlas CI

on:
  push:
    branches: [main]
    paths:
      - "atlas_sdk/**"
      - "atlasdaemon/**"
      - ".github/workflows/atlas-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "atlas_sdk/**"
      - "atlasdaemon/**"
      - ".github/workflows/atlas-ci.yml"

jobs:
  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # atlasdaemon depends on atlas_sdk, so a change to atlas_sdk re-checks both
        package: [atlas_sdk, atlasdaemon]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Run tests
        # skipped until the package has a tests/ folder
        if: hashFiles(format('{0}/tests/**', matrix.package)) != ''
        run: uv run pytest --tb=short -q
