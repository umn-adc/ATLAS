name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/python-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Pyright
        run: uv run pyright

  test:
    name: Test
    runs-on: ubuntu-latest
    # Tests are optional until pricing functions are implemented
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run pytest --tb=short -q

  migrations:
    name: Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check for pending migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check || {
            echo ""
            echo "=========================================="
            echo "MIGRATION CHECK FAILED"
            echo "=========================================="
            echo "Your models are out of sync with migrations."
            echo ""
            echo "To fix, run locally:"
            echo "  cd backend"
            echo "  uv run alembic revision --autogenerate -m \"describe your change\""
            echo "  uv run alembic upgrade head"
            echo ""
            echo "Then commit the new migration file."
            echo "=========================================="
            exit 1
          }
        env:
          DATABASE_URL: sqlite:///./test.db
