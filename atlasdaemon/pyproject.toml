[project]
name = "atlasdaemon"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "atlas-sdk",
    "msgspec",
]

[tool.uv.sources]
atlas-sdk = { path = "../atlas_sdk", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyright",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Docs hold pseudocode; don't let `ruff format` rewrite their code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
# Tell ruff which modules are our own code and not third-party packages.
known-first-party = ["atlasdaemon", "atlas_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Put the repo root on the import path so `from atlasdaemon... import ...` resolves.
pythonpath = [".."]

[tool.pyright]
pythonVersion = "3.13"
extraPaths = [".."]
typeCheckingMode = "basic"
exclude = ["**/__pycache__", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false
